name: Publish Logseq Web Portal

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Logseq Publish
        uses: pengx17/logseq-publish@main
        # If you previously used the version parameter in publish-spa,
        # it's not needed here. This action runs the desktop app inside a Docker container,
        # and the version is controlled by the container image itself.

      - name: Add nojekyll file
        run: touch $GITHUB_WORKSPACE/www/.nojekyll

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: www
          branch: gh-pages