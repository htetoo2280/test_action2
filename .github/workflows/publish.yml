name: Publish Logseq Web Portal

on:
  push:
    branches:
      - main  # Set to your primary branch name

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Build the Logseq Single Page Application (SPA)
      - name: Build Logseq SPA
        uses: logseq/publish-spa@v0.3.0
        with:
          version: '0.10.15'

      # Ensure GitHub Pages serves assets correctly
      - name: Add nojekyll file
        run: touch $GITHUB_WORKSPACE/www/.nojekyll

      # Deploy the build folder (www) to the gh-pages branch
      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: www
          branch: gh-pages